name: release
on:
  push:
    tags: ['v*.*.*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        shell: bash
        run: |
          rm -f .npmrc
          npm ci
      - name: Build (mac)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${{ secrets.MAC_CERT_P12 }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CERT_P12 }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CERT_PASSWORD }}"
          fi
          npm run dist:mac
      - name: Build (win)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CERT_PFX }}" ]; then
            export CSC_LINK="${{ secrets.WIN_CERT_PFX }}"
            export CSC_KEY_PASSWORD="${{ secrets.WIN_CERT_PASSWORD }}"
          fi
          npm run dist:win
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
